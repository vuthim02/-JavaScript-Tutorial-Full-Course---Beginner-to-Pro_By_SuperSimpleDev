<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 1: JavaScript Basics</title>
  </head>
  <body>
    <p>
      Open the Console (Right Click > Inspect > Console)
      to see the JavaScript output.
    </p>

    <button onclick="alert('Hello!');">
      Click me
    </button>

    <script>
      // JavaScript Basics: giving instructions to the computer

      // 1. Popup (alert box)
      alert('Hello!');

      // 2. Display on the page
      document.body.innerHTML = 'Hello';

      // 3. Print to the console
      console.log('Hello');
      console.log('Good job!');

      // 4. Math in the console
      console.log(2 + 2);
      console.log(10 - 3);
    </script>
  </body>
</html>
