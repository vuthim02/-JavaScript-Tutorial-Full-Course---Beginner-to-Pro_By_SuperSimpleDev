<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 2: Numbers and Math</title>
  </head>
  <body>
    <p>
      Open the Console to see JavaScript math examples.
    </p>

    <script>
      // --- Basics of Math ---
      console.log(2 + 2);   // 4
      console.log(10 - 3);  // 7
      console.log(10 * 3);  // 30
      console.log(10 / 2);  // 5

      // Multiple operations
      console.log(2 + 2 + 2);  // 6
      console.log(2.2 + 2.2);  // 4.4

      // Practical: calculating cost
      // 2 items: $10.90 each, plus shipping $4.99
      console.log(10.90 * 2 + 20.95);        // 42.75
      console.log(10.90 * 2 + 20.95 + 4.99); // 47.74

      // --- Order of operations ---
      console.log(1 + 1 * 3);   // 4 (multiplication first)
      console.log((1 + 1) * 3); // 6 (brackets first)

      // --- Inaccuracies with floats ---
      console.log(0.1 + 0.2);          // 0.30000000000000004
      console.log(20.95 + 7.99);       // 28.939999999999998

      // Fix: work in cents
      console.log((2095 + 799) / 100); // 28.94

      // --- How to round numbers ---
      console.log(Math.round(2.2));  // 2
      console.log(Math.round(2.8));  // 3

      // Calculate 10% tax on ($20.95 + $7.99 * 2)
      console.log(Math.round((2095 + 799 * 2) * 0.1) / 100);
    </script>
  </body>
</html>
