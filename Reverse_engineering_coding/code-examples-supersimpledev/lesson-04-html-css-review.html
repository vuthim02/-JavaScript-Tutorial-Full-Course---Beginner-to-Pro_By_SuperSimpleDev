<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 4: HTML CSS Review</title>
    <style>
      .red-button {
        background-color: red;
        color: white;
        border: none;
        padding: 8px 16px;
        cursor: pointer;
      }

      .yellow-button {
        background-color: yellow;
        border: none;
        padding: 8px 16px;
        cursor: pointer;
      }

      .sub-button {
        background-color: rgb(200, 0, 0);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 2px;
        cursor: pointer;
      }

      .sub-button.is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }
    </style>
  </head>
  <body>
    <!-- HTML buttons with onclick that runs JavaScript -->
    <button
      title="Good job!"
      class="red-button"
      onclick="alert('Good job!');"
    >
      hello
    </button>

    <button class="yellow-button" onclick="console.log('clicked');">
      click me
    </button>

    <p>
      paragraph of
      <button class="yellow-button">hello</button>
      text
    </p>

    <!-- Toggle subscribe button with JS -->
    <button onclick="
      const button = document.querySelector('.sub-button');
      button.classList.toggle('is-subscribed');

      if (button.innerText === 'Subscribe') {
        button.innerText = 'Subscribed';
      } else {
        button.innerText = 'Subscribe';
      }
    " class="sub-button">
      Subscribe
    </button>

    <script>
      // console.log prints to the console
      console.log(2 + 2);
      console.log('some' + 'text');

      // Comments are ignored by JavaScript
      // alert('hello');  // this is commented out
    </script>
  </body>
</html>
