<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 6: Booleans and If-Statements</title>
    <style>
      body {
        font-family: Arial;
      }
    </style>
  </head>
  <body>
    <p>Rock Paper Scissors (play in console)</p>
    <button onclick="playGame('rock');">Rock</button>
    <button onclick="playGame('paper');">Paper</button>
    <button onclick="playGame('scissors');">Scissors</button>

    <script>
      // Booleans: true or false
      console.log(true);
      console.log(false);

      // Comparison operators produce booleans
      console.log(3 > 2);   // true
      console.log(3 < 2);   // false
      console.log(5 >= 5);  // true
      console.log(5 === 5); // true (strict equality)
      console.log(5 === '5'); // false (different types)
      console.log(5 == '5');  // true (loose equality - avoid)

      // If-statements
      if (true) {
        console.log('This always runs');
      }

      if (false) {
        console.log('This never runs');
      }

      // Practical example
      const age = 15;

      if (age >= 16) {
        console.log('You can drive');
        console.log('Congrats');
      } else if (age >= 14) {
        console.log('Almost there!');
      } else {
        console.log('You cannot drive');
      }

      // Logical operators
      console.log(true && false);  // false
      console.log(true || false);  // true
      console.log(!false);         // true

      // Truthy and falsy values
      if (0) {
        console.log('0 is falsy, this does NOT run');
      }

      if (1) {
        console.log('1 is truthy, this runs');
      }

      // Falsy values: false, 0, '', null, undefined, NaN

      // Short-circuit evaluation
      false && console.log('this does not run');
      true || console.log('this does not run');

      // Ternary operator
      const result = 0 ? 'truthy' : 'falsy';
      console.log(result);  // 'falsy'

      // Guard operator (&&)
      const message = 5 && 'hello';
      console.log(message);  // 'hello'

      // Default operator (||)
      const currency = undefined || 'USD';
      console.log(currency);  // 'USD'

      // --- Mini Rock Paper Scissors ---
      function playGame(playerMove) {
        const randomNumber = Math.random();
        let computerMove = '';

        if (randomNumber < 1/3) {
          computerMove = 'rock';
        } else if (randomNumber < 2/3) {
          computerMove = 'paper';
        } else {
          computerMove = 'scissors';
        }

        let result = '';

        if (playerMove === computerMove) {
          result = 'Tie';
        } else if (
          (playerMove === 'rock' && computerMove === 'scissors') ||
          (playerMove === 'paper' && computerMove === 'rock') ||
          (playerMove === 'scissors' && computerMove === 'paper')
        ) {
          result = 'You win!';
        } else {
          result = 'You lose!';
        }

        console.log(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
        alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
      }
    </script>
  </body>
</html>
