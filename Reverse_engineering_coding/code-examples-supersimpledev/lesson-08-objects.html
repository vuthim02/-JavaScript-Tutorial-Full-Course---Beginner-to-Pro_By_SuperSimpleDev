<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 8: Objects</title>
  </head>
  <body>
    <p>Open the Console to see object examples.</p>

    <script>
      // Object = group of related properties
      const product = {
        name: 'socks',
        price: 1090
      };
      console.log(product);
      console.log(product.name);   // 'socks'
      console.log(product.price);  // 1090

      // Change a property
      product.name = 'cotton socks';
      console.log(product);

      // Add a new property
      product.newProperty = true;
      console.log(product);

      // Delete a property
      delete product.newProperty;
      console.log(product);

      // Nested objects
      const product2 = {
        name: 'shirt',
        'delivery-time': '1 day',
        rating: {
          stars: 4.5,
          count: 87
        },
        fun: function() {
          console.log('function inside object');
        }
      };
      console.log(product2.name);
      console.log(product2['name']);
      console.log(product2['delivery-time']);  // bracket notation for hyphens
      console.log(product2.rating.count);
      product2.fun();

      // Built-in objects: JSON
      console.log(JSON.stringify(product2));
      const jsonString = JSON.stringify(product2);
      console.log(JSON.parse(jsonString));

      // Built-in objects: String
      console.log('hello'.length);          // 5
      console.log('hello'.toUpperCase());   // 'HELLO'

      // Objects and references
      const object1 = {
        message: 'hello',
        price: 799
      };
      const object2 = object1;  // both point to same object
      object1.message = 'Good job!';
      console.log(object2.message);  // 'Good job!' (changed)

      // Destructuring
      const { message, price: cost } = object1;
      console.log(message);  // 'Good job!'
      console.log(cost);     // 799

      // Shorthand property
      const object4 = {
        message,   // same as message: message
        method() { // shorthand for method: function() {}
          console.log('shorthand method');
        }
      };
    </script>
  </body>
</html>
