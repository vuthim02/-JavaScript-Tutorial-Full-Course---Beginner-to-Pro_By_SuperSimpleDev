<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 10: HTML, CSS, and JS Together</title>
    <style>
      body {
        font-family: Arial;
        background-color: rgb(25, 25, 25);
        color: white;
        text-align: center;
        padding-top: 50px;
      }

      .move-icon {
        height: 50px;
      }

      .move-button {
        background-color: transparent;
        border: 3px solid white;
        width: 120px;
        height: 120px;
        border-radius: 60px;
        margin: 10px;
        cursor: pointer;
      }

      .result {
        font-size: 25px;
        font-weight: bold;
        margin-top: 50px;
      }

      .score {
        margin-top: 60px;
      }

      .reset-button {
        background-color: white;
        border: none;
        font-size: 15px;
        padding: 8px 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <button class="move-button" onclick="playGame('rock');">
      <img src="https://supersimple.dev/projects/rock-paper-scissors/images/rock-emoji.png" class="move-icon">
    </button>

    <button class="move-button" onclick="playGame('paper');">
      <img src="https://supersimple.dev/projects/rock-paper-scissors/images/paper-emoji.png" class="move-icon">
    </button>

    <button class="move-button" onclick="playGame('scissors');">
      <img src="https://supersimple.dev/projects/rock-paper-scissors/images/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-button" onclick="
      score = { wins: 0, losses: 0, ties: 0 };
      localStorage.removeItem('score');
      updateScoreElement();
    ">
      Reset Score
    </button>

    <script>
      let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      function playGame(playerMove) {
        const computerMove = pickComputerMove();
        let result = '';

        if (playerMove === computerMove) {
          result = 'Tie';
        } else if (
          (playerMove === 'rock' && computerMove === 'scissors') ||
          (playerMove === 'paper' && computerMove === 'rock') ||
          (playerMove === 'scissors' && computerMove === 'paper')
        ) {
          result = 'You win!';
        } else {
          result = 'You lose!';
        }

        if (result === 'You win!') {
          score.wins++;
        } else if (result === 'You lose!') {
          score.losses++;
        } else {
          score.ties++;
        }

        localStorage.setItem('score', JSON.stringify(score));

        document.querySelector('.js-result').innerHTML = result;
        document.querySelector('.js-moves').innerHTML = `
          You
          <img src="https://supersimple.dev/projects/rock-paper-scissors/images/${playerMove}-emoji.png" class="move-icon">
          <img src="https://supersimple.dev/projects/rock-paper-scissors/images/${computerMove}-emoji.png" class="move-icon">
          Computer
        `;

        updateScoreElement();
      }

      function updateScoreElement() {
        document.querySelector('.js-score').innerHTML =
          `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
      }

      function pickComputerMove() {
        const randomNumber = Math.random();

        if (randomNumber < 1/3) {
          return 'rock';
        } else if (randomNumber < 2/3) {
          return 'paper';
        } else {
          return 'scissors';
        }
      }

      updateScoreElement();
    </script>
  </body>
</html>
