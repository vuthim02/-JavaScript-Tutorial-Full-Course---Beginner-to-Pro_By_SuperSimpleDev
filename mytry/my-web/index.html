<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My website</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        /* display: flex — flexbox layout */
        form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-color: #ffffff;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 8px;
        }

        /* display: block — each on its own line */
        label {
            display: block;
            font-weight: bold;
        }

        /* display: block — full width inputs */
        input[type="text"],
        input[type="email"],
        textarea,
        select {
            display: block;
            width: 100%;
            padding: 8px;
            border: 1px solid #999999;
            border-radius: 4px;
            background-color: #fafafa;
        }

        /* display: inline-block — checkbox sits inline */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-group input[type="checkbox"] {
            display: inline-block;
        }

        .checkbox-group label {
            display: inline;
            font-weight: normal;
        }

        /* display: inline-block — button stays inline */
        button {
            display: inline-block;
            align-self: flex-start;
            padding: 10px 20px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* display: none — hidden element */
        .hidden-note {
            display: none;
        }
    </style>
</head>
<body>
    <form action="/submit" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required minlength="2">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="msg">Message</label>
        <textarea id="msg" name="message" rows="4"></textarea>

        <label for="topic">Topic</label>
        <select name="topic" id="topic">
            <optgroup label="Technical">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </optgroup>
        </select>

        <div class="checkbox-group">
            <input type="checkbox" id="agree" required>
            <label for="agree">I agree</label>
        </div>

        <p class="hidden-note">This paragraph is hidden with display: none.</p>

        <button type="submit">Send</button>
    </form>
</body>
</html>
