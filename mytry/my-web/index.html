<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Try HTML</title>
        <link rel="stylesheet" href="./css/stye.css">
    </head>
    <body>
        <form action="/submit" method="post">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" required minlength="2">

            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>

            <label for="Message">Message</label>
            <textarea name="message" id="msg" rows="7""></textarea>

            <label for="topic">Topic</label>
            <select name="topic" id="topic">
                <optgroup label="Teachnical">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                </optgroup>
            </select>

            <div class="checkbox-group">
            <input type="checkbox" id="agree" required>
            <label for="agree">I agree</label>
            </div>

            <p class="hiden-note">This paragraph is hidden with display: none.</p>
            <button type="submit">Send</button>
        </form>
    </body>
</html>
