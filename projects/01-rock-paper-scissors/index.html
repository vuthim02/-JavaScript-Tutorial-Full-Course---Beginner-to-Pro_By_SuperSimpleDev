<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    h1 {
      color: white;
      font-size: 2.5rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .game-container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    
    .score-board {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
    }
    
    .score {
      text-align: center;
    }
    
    .score-label {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 5px;
    }
    
    .score-value {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
    }
    
    .result-display {
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .result-text {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    .result-text.win { color: #4CAF50; }
    .result-text.lose { color: #f44336; }
    .result-text.draw { color: #FF9800; }
    
    .moves {
      font-size: 1.2rem;
      color: #666;
    }
    
    .choices {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .choice-btn {
      background: #667eea;
      border: none;
      padding: 15px 25px;
      font-size: 1.1rem;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .choice-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .choice-btn:active {
      transform: translateY(0);
    }
    
    .reset-btn {
      background: #f44336;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .reset-btn:hover {
      background: #d32f2f;
    }
    
    .history {
      margin-top: 20px;
      text-align: left;
      max-height: 150px;
      overflow-y: auto;
    }
    
    .history h3 {
      margin-bottom: 10px;
      color: #333;
    }
    
    .history-list {
      list-style: none;
    }
    
    .history-item {
      padding: 8px;
      margin-bottom: 5px;
      background: #f5f5f5;
      border-radius: 5px;
      font-size: 0.9rem;
    }
    
    .history-item.win { border-left: 3px solid #4CAF50; }
    .history-item.lose { border-left: 3px solid #f44336; }
    .history-item.draw { border-left: 3px solid #FF9800; }
  </style>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  
  <div class="game-container">
    <div class="score-board">
      <div class="score">
        <div class="score-label">You</div>
        <div class="score-value" id="player-score">0</div>
      </div>
      <div class="score">
        <div class="score-label">Draws</div>
        <div class="score-value" id="draws">0</div>
      </div>
      <div class="score">
        <div class="score-label">Computer</div>
        <div class="score-value" id="computer-score">0</div>
      </div>
    </div>
    
    <div class="result-display">
      <div class="result-text" id="result-text">Make your choice!</div>
      <div class="moves" id="moves"></div>
    </div>
    
    <div class="choices">
      <button class="choice-btn" data-choice="rock">Rock</button>
      <button class="choice-btn" data-choice="paper">Paper</button>
      <button class="choice-btn" data-choice="scissors">Scissors</button>
    </div>
    
    <button class="reset-btn" id="reset-btn">Reset Game</button>
    
    <div class="history">
      <h3>Game History</h3>
      <ul class="history-list" id="history-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
