<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Counter</h1>
    <div class="count" id="count">0</div>
    <div class="buttons">
      <button class="btn decrease" id="decreaseBtn">- Decrease</button>
      <button class="btn reset" id="resetBtn">Reset</button>
      <button class="btn increase" id="increaseBtn">Increase +</button>
    </div>
    <div class="history">
      <h2>History</h2>
      <ul id="historyList"></ul>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
