<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Bookmark Manager</h1>

    <form id="form">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. GitHub" required>
      </div>
      <div class="field">
        <label for="url">URL</label>
        <input type="url" id="url" placeholder="e.g. https://github.com" required>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Learning">Learning</option>
          <option value="Social">Social</option>
          <option value="Entertainment">Entertainment</option>
        </select>
      </div>
      <button type="submit">Save Bookmark</button>
    </form>

    <input type="text" id="search" placeholder="Search bookmarks...">

    <div class="filter-btns">
      <button class="filter-btn active" data-cat="All">All</button>
      <button class="filter-btn" data-cat="General">General</button>
      <button class="filter-btn" data-cat="Work">Work</button>
      <button class="filter-btn" data-cat="Learning">Learning</button>
      <button class="filter-btn" data-cat="Social">Social</button>
      <button class="filter-btn" data-cat="Entertainment">Entertainment</button>
    </div>

    <div class="bookmarks" id="bookmarks"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
