<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <div class="balance-card">
      <p class="label">Balance</p>
      <p class="balance" id="balance">$0.00</p>
    </div>

    <div class="income-expense">
      <div class="card income-card">
        <p class="label">Income</p>
        <p class="amount" id="income">$0.00</p>
      </div>
      <div class="card expense-card">
        <p class="label">Expense</p>
        <p class="amount" id="expense">$0.00</p>
      </div>
    </div>

    <form id="form">
      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Salary" required>
      </div>
      <div class="field">
        <label for="amount">Amount (negative for expense)</label>
        <input type="number" id="amount" placeholder="e.g. 100 or -50" step="0.01" required>
      </div>
      <button type="submit">Add Entry</button>
    </form>

    <ul class="entries" id="entries"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
