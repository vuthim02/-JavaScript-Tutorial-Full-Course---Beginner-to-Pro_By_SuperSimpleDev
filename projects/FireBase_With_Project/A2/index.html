<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Firestore CRUD - A2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- LOGIN -->
    <div id="auth-section">
      <h2>Login to manage your notes</h2>
      <input type="email" id="login-email" placeholder="Email" />
      <input type="password" id="login-password" placeholder="Password" />
      <button id="login-btn">Login</button>
      <button id="google-btn" class="google-btn">Sign in with Google</button>
      <p id="auth-error" class="error-message"></p>
      <p class="toggle">Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
    </div>

    <!-- SIGNUP -->
    <div id="signup-section" class="hidden">
      <h2>Create Account</h2>
      <input type="text" id="signup-name" placeholder="Full Name" />
      <input type="email" id="signup-email" placeholder="Email" />
      <input type="password" id="signup-password" placeholder="Password (6+ chars)" />
      <button id="signup-btn">Sign Up</button>
      <p id="signup-error" class="error-message"></p>
      <p class="toggle">Already have an account? <a href="#" id="show-login">Login</a></p>
    </div>

    <!-- NOTES APP -->
    <div id="notes-section" class="hidden">
      <div class="header">
        <h2>My Notes</h2>
        <button id="logout-btn" class="small-btn">Logout</button>
      </div>

      <div class="add-note">
        <input type="text" id="note-input" placeholder="Write a note..." />
        <button id="add-btn">Add</button>
      </div>

      <div id="notes-list"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
