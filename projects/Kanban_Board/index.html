<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Kanban Board</h1>

    <div class="board" id="board">
      <div class="column" data-col="todo">
        <div class="col-header">To Do</div>
        <div class="col-body" id="colTodo"></div>
        <button class="add-card-btn" data-col="todo">+ Add Card</button>
      </div>

      <div class="column" data-col="progress">
        <div class="col-header">In Progress</div>
        <div class="col-body" id="colProgress"></div>
        <button class="add-card-btn" data-col="progress">+ Add Card</button>
      </div>

      <div class="column" data-col="done">
        <div class="col-header">Done</div>
        <div class="col-body" id="colDone"></div>
        <button class="add-card-btn" data-col="done">+ Add Card</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
