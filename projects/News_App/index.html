<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>News App</h1>

    <div class="setup-card" id="setupCard">
      <p>This app uses the <strong>GNews API</strong>. Get your free API key:</p>
      <ol>
        <li>Go to <a href="https://gnews.io/" target="_blank">gnews.io</a> and sign up (free)</li>
        <li>Copy your API key from the dashboard</li>
        <li>Paste it below and click <strong>Save</strong></li>
      </ol>
      <div class="key-row">
        <input type="text" id="apiKeyInput" placeholder="Paste your GNews API key here...">
        <button id="saveKeyBtn">Save</button>
      </div>
      <p class="hint">Your key is saved in your browser. You only need to do this once.</p>
    </div>

    <div class="app-main" id="appMain" style="display:none">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search news... (e.g. book, AI, climate)">
        <button id="searchBtn">Search</button>
      </div>

      <div class="categories" id="categories">
        <button class="cat-btn active" data-cat="general">General</button>
        <button class="cat-btn" data-cat="world">World</button>
        <button class="cat-btn" data-cat="technology">Technology</button>
        <button class="cat-btn" data-cat="business">Business</button>
        <button class="cat-btn" data-cat="science">Science</button>
        <button class="cat-btn" data-cat="health">Health</button>
        <button class="cat-btn" data-cat="sports">Sports</button>
        <button class="cat-btn" data-cat="entertainment">Entertainment</button>
      </div>

      <div class="news-grid" id="newsGrid"></div>
    </div>

    <div class="error" id="error"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
