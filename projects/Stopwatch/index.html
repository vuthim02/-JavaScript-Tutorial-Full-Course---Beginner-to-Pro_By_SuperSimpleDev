<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Stopwatch</h1>
    <div class="display" id="display">00y-000d 00:00:00.000000000000000</div>
    <div class="display-light" id="displayLight">0.000000000 ly</div>
    <div class="status stopped" id="status">STOPPED</div>
    <div class="time-info">YYy-DDDd HH:MM:SS.μμμnnnpppfff</div>
    <div class="buttons">
      <button class="btn" id="startBtn">Start</button>
      <button class="btn" id="stopBtn">Stop</button>
      <button class="btn" id="resetBtn">Reset</button>
      <button class="btn" id="lapBtn">Lap</button>
    </div>
    <ul class="laps" id="laps"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
