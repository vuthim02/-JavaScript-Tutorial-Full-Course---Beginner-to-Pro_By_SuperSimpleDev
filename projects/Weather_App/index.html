<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-anim" id="bgAnim"></div>

  <div class="container">
    <div class="app-header">
      <h1>Weather</h1>
      <div class="header-controls">
        <button class="geo-btn" id="geoBtn" title="Use my location">📍</button>
        <button class="unit-btn" id="unitBtn">°C / °F</button>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search city..." autocomplete="off" autofocus>
      <button id="searchBtn">Search</button>
      <div class="suggestions" id="suggestions"></div>
    </div>

    <div class="weather-card" id="weatherCard">
      <div class="city" id="cityName">--</div>
      <div class="date" id="date">--</div>
      <div class="temp" id="temp">--°</div>
      <div class="condition" id="condition">--</div>
      <img class="icon" id="icon" src="" alt="">
      <div class="feels-like">Feels like <span id="feelsLike">--°</span></div>

      <div class="extra-details">
        <div class="extra-item">
          <span class="extra-icon">💧</span>
          <span class="extra-label">Humidity</span>
          <span class="extra-value" id="humidity">--%</span>
        </div>
        <div class="extra-item">
          <span class="extra-icon">💨</span>
          <span class="extra-label">Wind</span>
          <span class="extra-value" id="wind">--</span>
        </div>
        <div class="extra-item">
          <span class="extra-icon">🌅</span>
          <span class="extra-label">Sunrise</span>
          <span class="extra-value" id="sunrise">--</span>
        </div>
        <div class="extra-item">
          <span class="extra-icon">🌇</span>
          <span class="extra-label">Sunset</span>
          <span class="extra-value" id="sunset">--</span>
        </div>
        <div class="extra-item">
          <span class="extra-icon">☀️</span>
          <span class="extra-label">UV Index</span>
          <span class="extra-value" id="uvIndex">--</span>
        </div>
        <div class="extra-item">
          <span class="extra-icon">🔽</span>
          <span class="extra-label">Pressure</span>
          <span class="extra-value" id="pressure">--</span>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>24-Hour Forecast</h2>
      <div class="hourly-scroll" id="hourlyScroll">
        <div class="hourly-container" id="hourlyContainer"></div>
      </div>
    </div>

    <div class="section">
      <h2>5-Day Forecast</h2>
      <div class="forecast-days" id="forecastDays"></div>
    </div>

    <div class="section recents-section">
      <h2>Recent Searches</h2>
      <div class="recents" id="recents"></div>
    </div>

    <div class="error" id="error"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
